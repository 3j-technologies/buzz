# Serves the buzz-web static bundle (see web/Dockerfile). Client-side routing
# (TanStack Router) means any unknown path must fall back to index.html
# rather than 404ing.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite content-hashes filenames) are safe to cache
    # forever; index.html itself must always revalidate so deploys take
    # effect immediately.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
